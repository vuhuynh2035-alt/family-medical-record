server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Bật nén Gzip giúp tải ứng dụng siêu nhanh trên điện thoại
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/x-javascript application/json application/xml image/svg+xml;

    # Service Worker & version.json: TUYỆT ĐỐI không cache để luôn nhận diện bản cập nhật mới
    location ~* (sw\.js|version\.json)$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        expires 0;
    }

    # index.html: Luôn xác thực lại với server
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Tài nguyên tĩnh có cache-busting (CSS, JS, Fonts, Images)
    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, no-transform";
    }

    # SPA & PWA Fallback: Mọi request trang con đều trỏ về index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
